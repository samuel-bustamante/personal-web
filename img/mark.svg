<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 6 42 42">
  <!--
    The same graph that marks the current section in the menu, as the tab icon.
    Two differences, both for the size it is drawn at: the viewBox is cropped
    to the shape so it fills the 16px square rather than floating in it, and
    the edges are a touch heavier and less faint than on the page, where they
    have room to be quiet. The colours are the accent of each theme — a
    favicon has no page to inherit from, so it answers the browser's own
    light/dark setting instead.
  -->
  <title>Samuel Bustamante-Larriet</title>
  <style>
    .edge { stroke: #2563eb; opacity: 0.5 }
    .node { fill: #2563eb }

    @media (prefers-color-scheme: dark) {
      .edge { stroke: #60a5fa }
      .node { fill: #60a5fa }
    }
  </style>
  <g class="edge" fill="none" stroke-width="2.6" stroke-linecap="round">
    <line x1="13" y1="30" x2="24" y2="13"/>
    <line x1="24" y1="13" x2="36" y2="26"/>
    <line x1="13" y1="30" x2="36" y2="26"/>
    <line x1="7" y1="17" x2="13" y2="30"/>
    <line x1="30" y1="41" x2="36" y2="26"/>
  </g>
  <circle class="node" cx="13" cy="30" r="4"/>
  <circle class="node" cx="24" cy="13" r="4"/>
  <circle class="node" cx="36" cy="26" r="4"/>
  <circle class="node" cx="7" cy="17" r="4"/>
  <circle class="node" cx="30" cy="41" r="4"/>
</svg>
